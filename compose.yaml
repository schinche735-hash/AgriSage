services:
  agrisage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrisage
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      SECRET_KEY: ${SECRET_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.1-flash-lite}
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "2"
      TF_CPP_MIN_LOG_LEVEL: "2"
    volumes:
      - agrisage-data:/app/data
      - agrisage-uploads:/app/static/uploads
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  agrisage-data:
  agrisage-uploads:
