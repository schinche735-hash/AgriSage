<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | AgroSage</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}"></head>
<body class="auth-page"><main class="auth-shell"><a class="auth-brand" href="/">&#127793; AgroSage</a><section class="auth-card"><div class="auth-kicker">JOIN AGROSAGE</div><h1>Create your farmer account</h1><p class="auth-subtitle">Register to use crop disease detection and save your scan history.</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="auth-alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post" class="auth-form"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Full name<input type="text" name="name" autocomplete="name" minlength="2" maxlength="120" required placeholder="Your name"></label><label>Email address<input type="email" name="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label><button class="auth-submit" type="submit">Create account <span>&rarr;</span></button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section></main></body></html>
