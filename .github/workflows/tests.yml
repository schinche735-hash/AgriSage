name: Authentication and application tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install Flask==3.1.1 Pillow==11.3.0 numpy==1.26.4 "psycopg[binary]>=3.2,<4"
      - name: Run test suite
        env:
          AGROSAGE_SKIP_MODEL_WARMUP: "1"
        run: python -m unittest discover -s tests -v
